[workspace]
resolver = "3"
members = [
    "crates/hitch-protocol",
    "crates/hitch-store",
    "crates/hitch-context",
    "crates/hitch-app",
]
# Editor and terminal plugins build for wasm with their own toolchains and
# dependencies, so they are separate Cargo projects, not workspace members.
exclude = ["integrations"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
repository = "https://github.com/cbishopvelti/hitch"

[workspace.dependencies]
hitch-protocol = { path = "crates/hitch-protocol" }
hitch-store = { path = "crates/hitch-store" }
hitch-context = { path = "crates/hitch-context" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
iced = "0.14"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
