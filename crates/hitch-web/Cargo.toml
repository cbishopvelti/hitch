[package]
name = "hitch-web"
description = "A small webview window Hitch opens for clawswap's branch page"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
publish = false

[dependencies]
hitch-protocol.workspace = true
# tao's default "dbus" feature links the C libdbus (libdbus-1-dev at build
# time) only to read the desktop portal's dark/light setting. hitch-web sets
# its theme itself (--dark), so leave it off and keep the build pure Rust.
tao = { version = "0.37", default-features = false, features = ["rwh_06", "x11"] }
wry = "0.57"

[target.'cfg(target_os = "linux")'.dependencies]
zbus = "5"
# The same GTK 3 bindings tao uses, to set the program name.
gtk = "0.18"

[lints]
workspace = true
