name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: WebKitGTK for hitch-web
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: WebKitGTK for hitch-web
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --workspace --all-targets
      - run: cargo test --workspace

  macos:
    name: macOS
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets -- -D warnings
      # Includes hitch-macos's on_a_mac test, which runs the focus watcher on
      # the runner's desktop session.
      - run: cargo test --workspace --no-fail-fast
        env:
          RUST_BACKTRACE: 1
      - name: Build Hitch.app
        run: packaging/macos/build-app.sh
      - uses: actions/upload-artifact@v4
        with:
          name: Hitch-macos-arm64
          path: target/release/Hitch-macos.zip

  protocol-wasm:
    name: hitch-protocol (wasm32-wasip1)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip1
      - run: cargo build -p hitch-protocol --target wasm32-wasip1

  zellij-plugin:
    name: Zellij plugin
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: integrations/zellij
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip1
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: integrations/zellij
      - run: cargo fmt --check
      - run: cargo clippy --target x86_64-unknown-linux-gnu --all-targets -- -D warnings
      - run: cargo test --target x86_64-unknown-linux-gnu
      - run: cargo build --release --target wasm32-wasip1
